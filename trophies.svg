<svg width="800" height="170" viewBox="0 0 800 170" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#170a24"/><stop offset="100%" stop-color="#2c1140"/>
  </linearGradient>
  <linearGradient id="shine2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <style>.tt{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#e9d6ff;font-weight:600;}
  .tr{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#c9a2ff;}</style>
</defs>
<rect x="0" y="0" width="800" height="170" rx="16" fill="url(#trophyBg)" stroke="#8a5cff" stroke-opacity="0.4"/>

<!-- 5 trophy cells -->
<g>
  <!-- template repeated with offsets -->
  <g transform="translate(30,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <rect width="130" height="130" rx="12" fill="#1e0f30" stroke="#ff5fa2" stroke-opacity="0.5"/>
    <text x="65" y="45" text-anchor="middle" font-size="34">🏆</text>
    <text x="65" y="75" text-anchor="middle" class="tt">Commits</text>
    <text x="65" y="93" text-anchor="middle" class="tr">Rank S</text>
    <rect width="40" height="130" fill="url(#shine2)"><animate attributeName="x" values="-40;130" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(174,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <rect width="130" height="130" rx="12" fill="#1e0f30" stroke="#c86bff" stroke-opacity="0.5"/>
    <text x="65" y="45" text-anchor="middle" font-size="34">⭐</text>
    <text x="65" y="75" text-anchor="middle" class="tt">Stars</text>
    <text x="65" y="93" text-anchor="middle" class="tr">Rank A</text>
    <rect width="40" height="130" fill="url(#shine2)"><animate attributeName="x" values="-40;130" dur="3s" begin="1.3s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(318,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
    <rect width="130" height="130" rx="12" fill="#1e0f30" stroke="#8a5cff" stroke-opacity="0.5"/>
    <text x="65" y="45" text-anchor="middle" font-size="34">🔀</text>
    <text x="65" y="75" text-anchor="middle" class="tt">Pull Requests</text>
    <text x="65" y="93" text-anchor="middle" class="tr">Rank B+</text>
    <rect width="40" height="130" fill="url(#shine2)"><animate attributeName="x" values="-40;130" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(462,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <rect width="130" height="130" rx="12" fill="#1e0f30" stroke="#7c8cff" stroke-opacity="0.5"/>
    <text x="65" y="45" text-anchor="middle" font-size="34">📘</text>
    <text x="65" y="75" text-anchor="middle" class="tt">Repositories</text>
    <text x="65" y="93" text-anchor="middle" class="tr">Rank B</text>
    <rect width="40" height="130" fill="url(#shine2)"><animate attributeName="x" values="-40;130" dur="3s" begin="1.9s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(606,20)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
    <rect width="130" height="130" rx="12" fill="#1e0f30" stroke="#ff9ad6" stroke-opacity="0.5"/>
    <text x="65" y="45" text-anchor="middle" font-size="34">🔥</text>
    <text x="65" y="75" text-anchor="middle" class="tt">Streak</text>
    <text x="65" y="93" text-anchor="middle" class="tr">Rank A-</text>
    <rect width="40" height="130" fill="url(#shine2)"><animate attributeName="x" values="-40;130" dur="3s" begin="2.2s" repeatCount="indefinite"/></rect>
  </g>
</g>
</svg>
