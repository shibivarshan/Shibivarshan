<svg width="470" height="195" viewBox="0 0 470 195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#170a24"/><stop offset="100%" stop-color="#2c1140"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff5fa2"/><stop offset="100%" stop-color="#8a5cff"/>
  </linearGradient>
  <style>.lbl{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#d9c9ff;}
  .val{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#ffffff;font-weight:700;}
  .title{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;fill:#ffffff;font-weight:700;}</style>
</defs>
<rect x="0" y="0" width="470" height="195" rx="16" fill="url(#statsBg)" stroke="#8a5cff" stroke-opacity="0.4"/>
<text x="24" y="34" class="title">Shibi's GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(90,120)">
  <circle r="55" fill="none" stroke="#3a2050" stroke-width="10"/>
  <circle r="55" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="345" stroke-dashoffset="345" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="345" to="72" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </circle>
  <text text-anchor="middle" y="-2" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#ffffff">A+</text>
  <text text-anchor="middle" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#c9a2ff">Rank</text>
</g>

<!-- stat rows sliding in -->
<g transform="translate(190,0)">
  <g transform="translate(0,60)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="40,60;0,60" dur="0.5s" begin="0.6s" fill="freeze"/>
    <text class="lbl" x="0" y="0">⭐ Total Stars</text><text class="val" x="220" y="0" text-anchor="end">42</text>
  </g>
  <g transform="translate(0,90)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="40,90;0,90" dur="0.5s" begin="0.8s" fill="freeze"/>
    <text class="lbl" x="0" y="0">📦 Total Commits</text><text class="val" x="220" y="0" text-anchor="end">610</text>
  </g>
  <g transform="translate(0,120)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="40,120;0,120" dur="0.5s" begin="1.0s" fill="freeze"/>
    <text class="lbl" x="0" y="0">🔀 Total PRs</text><text class="val" x="220" y="0" text-anchor="end">18</text>
  </g>
  <g transform="translate(0,150)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="40,150;0,150" dur="0.5s" begin="1.2s" fill="freeze"/>
    <text class="lbl" x="0" y="0">👥 Contributed to</text><text class="val" x="220" y="0" text-anchor="end">6</text>
  </g>
</g>
</svg>
