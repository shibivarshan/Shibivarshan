<svg width="330" height="195" viewBox="0 0 330 195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#170a24"/><stop offset="100%" stop-color="#2c1140"/>
  </linearGradient>
  <style>.lbl{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#d9c9ff;}
  .pct{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#ffffff;font-weight:700;}
  .title{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;fill:#ffffff;font-weight:700;}</style>
</defs>
<rect x="0" y="0" width="330" height="195" rx="16" fill="url(#langsBg)" stroke="#8a5cff" stroke-opacity="0.4"/>
<text x="20" y="30" class="title">Most Used Languages</text>

<g transform="translate(20,55)">
  <!-- Python -->
  <text class="lbl" x="0" y="0">Python</text><text class="pct" x="286" y="0" text-anchor="end">58%</text>
  <rect x="0" y="8" width="286" height="8" rx="4" fill="#3a2050"/>
  <rect x="0" y="8" width="0" height="8" rx="4" fill="#ff5fa2"><animate attributeName="width" from="0" to="166" dur="1.2s" begin="0.3s" fill="freeze"/></rect>

  <!-- SQL -->
  <text class="lbl" x="0" y="38">SQL</text><text class="pct" x="286" y="38" text-anchor="end">18%</text>
  <rect x="0" y="46" width="286" height="8" rx="4" fill="#3a2050"/>
  <rect x="0" y="46" width="0" height="8" rx="4" fill="#c86bff"><animate attributeName="width" from="0" to="52" dur="1.2s" begin="0.5s" fill="freeze"/></rect>

  <!-- Jupyter Notebook -->
  <text class="lbl" x="0" y="76">Jupyter Notebook</text><text class="pct" x="286" y="76" text-anchor="end">15%</text>
  <rect x="0" y="84" width="286" height="8" rx="4" fill="#3a2050"/>
  <rect x="0" y="84" width="0" height="8" rx="4" fill="#8a5cff"><animate attributeName="width" from="0" to="43" dur="1.2s" begin="0.7s" fill="freeze"/></rect>

  <!-- HTML/CSS -->
  <text class="lbl" x="0" y="114">HTML / CSS</text><text class="pct" x="286" y="114" text-anchor="end">9%</text>
  <rect x="0" y="122" width="286" height="8" rx="4" fill="#3a2050"/>
  <rect x="0" y="122" width="0" height="8" rx="4" fill="#7c8cff"><animate attributeName="width" from="0" to="26" dur="1.2s" begin="0.9s" fill="freeze"/></rect>
</g>
</svg>
