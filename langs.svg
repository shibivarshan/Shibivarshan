<svg width="330" height="195" viewBox="0 0 330 195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#061a2e"/><stop offset="100%" stop-color="#0c2c48"/>
  </linearGradient>
  <style>.lbl{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#bfe3ff;}
  .pct{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;fill:#ffffff;font-weight:700;}
  .title{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;fill:#ffffff;font-weight:700;}
  .sub{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;fill:#6ea3c9;}</style>
</defs>
<rect x="0" y="0" width="330" height="195" rx="16" fill="url(#langsBg)" stroke="#0ea5e9" stroke-opacity="0.4"/>
<text x="20" y="30" class="title">Most Used Languages</text>

<g transform="translate(20,60)">
  <text class="lbl" x="0" y="0">Python</text><text class="pct" x="286" y="0" text-anchor="end">100%</text>
  <rect x="0" y="8" width="286" height="10" rx="5" fill="#123a5c"/>
  <rect x="0" y="8" width="0" height="10" rx="5" fill="#00d4ff"><animate attributeName="width" from="0" to="286" dur="1.3s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>
</g>

<text x="20" y="150" class="sub">Across 6 public repositories</text>
<text x="20" y="170" class="sub">More languages will show as the profile grows</text>
</svg>
