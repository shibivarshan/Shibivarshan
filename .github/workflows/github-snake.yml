name: Generate Snake

on:
  schedule:
    - cron: "0 2 * * *"   # runs daily at 2 AM UTC
  workflow_dispatch: {}    # allows manual "Run workflow" trigger
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: shibivarshan
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ff5fa2&color_dots=#3a2050,#8a5cff,#c86bff,#ff9ad6,#ffffff

      - name: Push snake output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
